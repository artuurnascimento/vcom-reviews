# Railway/Nixpacks: instalar devDependencies para o build (Vite, Remix).
[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[variables]
NODE_ENV = "production"
# Limite de heap Node (MB) — reduz OOM em picos (gerar/salvar muitas reviews).
NODE_OPTIONS = "--max-old-space-size=512"

[start]
cmd = "npm run start"
