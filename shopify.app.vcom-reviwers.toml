# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4a9d3ae260912edfdfb9937c2a6d8148"
application_url = "https://vcom-reviews-production.up.railway.app"
embedded = true
name = "vcom reviwers"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
scopes = "read_metaobject_definitions,write_metaobject_definitions,read_metaobjects,write_metaobjects,read_metafields,write_metafields,read_files,write_files,read_products,read_themes"

[auth]
redirect_urls = [
  "https://vcom-reviews-production.up.railway.app/auth/callback",
  "https://vcom-reviews-production.up.railway.app/auth/shopify/callback",
]

[pos]
embedded = false

[metaobjects.app.review]
name = "Review"
description = "Avaliações VCOM (homepage e produto)"
access.admin = "merchant_read_write"
access.storefront = "public_read"
display_name_field = "author"

[metaobjects.app.review.fields.rating]
name = "Rating"
type = "number_decimal"
required = true

[metaobjects.app.review.fields.verified_buyer]
name = "Verified buyer"
type = "boolean"

[metaobjects.app.review.fields.title]
name = "Title"
type = "single_line_text_field"

[metaobjects.app.review.fields.body]
name = "Body"
type = "multi_line_text_field"
required = true

[metaobjects.app.review.fields.author]
name = "Author"
type = "single_line_text_field"
required = true

[metaobjects.app.review.fields.time]
name = "Time"
type = "single_line_text_field"

[metaobjects.app.review.fields.status]
name = "Status"
type = "single_line_text_field"

[metaobjects.app.review.fields.placement]
name = "Placement"
type = "single_line_text_field"

[metaobjects.app.review.fields.product_id]
name = "Product ID"
type = "single_line_text_field"

[metaobjects.app.review.fields.images]
name = "Images"
type = "list.file_reference"

[app_proxy]
url = "https://vcom-reviews-production.up.railway.app/app_proxy"
subpath = "vcom-reviews"
prefix = "apps"
